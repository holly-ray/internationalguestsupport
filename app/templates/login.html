<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 国际宾客支持</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}}}}}</script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <div class="w-12 h-12 bg-brand-600 rounded-xl flex items-center justify-center text-white font-bold mx-auto mb-3">客</div>
    <h1 class="text-xl font-semibold text-gray-900">国际宾客支持</h1>
    <p class="text-sm text-gray-500 mt-1">登录或注册账号</p>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <div id="errorBox" class="hidden mb-4 p-3 rounded-lg text-sm bg-red-50 border border-red-200 text-red-800"></div>

    <!-- Mode tabs -->
    <div class="flex mb-5 bg-gray-100 rounded-lg p-1">
      <button id="tabLogin" onclick="switchMode('login')" class="flex-1 py-2 rounded-md text-sm font-medium bg-white shadow transition-all">登录</button>
      <button id="tabRegister" onclick="switchMode('register')" class="flex-1 py-2 rounded-md text-sm font-medium text-gray-500 transition-all">注册</button>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
      <input id="usernameInput" type="text" maxlength="20" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" placeholder="3-20位字母或数字" autocomplete="username">
    </div>

    <div class="mb-5">
      <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
      <input id="passwordInput" type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" placeholder="至少6位密码" autocomplete="current-password">
      <p id="registerHint" class="hidden mt-1.5 text-xs text-gray-400">注册后自动登录</p>
    </div>

    <button id="submitBtn" onclick="submitAuth()" class="w-full py-3 bg-brand-600 text-white rounded-xl font-semibold text-sm hover:bg-brand-700 transition-colors disabled:opacity-50">登录</button>
  </div>

  <p class="mt-6 text-center text-xs text-gray-400">
    <a href="/" class="hover:text-brand-600">返回首页</a>
  </p>
</div>

<script>
let mode = "login";

function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.classList.remove("hidden");
}

function hideError() {
  document.getElementById("errorBox").classList.add("hidden");
}

function switchMode(m) {
  mode = m;
  hideError();
  document.getElementById("tabLogin").className = m === "login"
    ? "flex-1 py-2 rounded-md text-sm font-medium bg-white shadow transition-all"
    : "flex-1 py-2 rounded-md text-sm font-medium text-gray-500 transition-all";
  document.getElementById("tabRegister").className = m === "register"
    ? "flex-1 py-2 rounded-md text-sm font-medium bg-white shadow transition-all"
    : "flex-1 py-2 rounded-md text-sm font-medium text-gray-500 transition-all";
  document.getElementById("submitBtn").textContent = m === "login" ? "登录" : "注册";
  document.getElementById("registerHint").classList.toggle("hidden", m === "login");
}

async function submitAuth() {
  hideError();
  const username = document.getElementById("usernameInput").value.trim().toLowerCase();
  const password = document.getElementById("passwordInput").value;

  if (!username || !password) {
    showError("请输入用户名和密码");
    return;
  }
  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    showError("用户名需3-20位字母、数字或下划线");
    return;
  }
  if (password.length < 6) {
    showError("密码至少6位");
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "请稍候...";

  const endpoint = mode === "login" ? "/api/auth/login" : "/api/auth/register";
  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.error) {
      showError(data.error);
      btn.disabled = false;
      btn.textContent = mode === "login" ? "登录" : "注册";
      return;
    }
    if (data.redirect) {
      window.location.href = data.redirect;
    }
  } catch (e) {
    showError("网络错误，请重试");
    btn.disabled = false;
    btn.textContent = mode === "login" ? "登录" : "注册";
  }
}

document.getElementById("passwordInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") submitAuth();
});
document.getElementById("usernameInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") document.getElementById("passwordInput").focus();
});
</script>
</body>
</html>
