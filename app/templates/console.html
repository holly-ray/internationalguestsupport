<script>
let currentPanel = "profile";

function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  const open = sidebar.classList.contains("-translate-x-full");
  sidebar.classList.toggle("-translate-x-full", !open);
  sidebar.classList.toggle("translate-x-0", open);
  overlay.classList.toggle("hidden", !open);
}

function showPanel(name) {
  currentPanel = name;
  // Hide all panels
  document.querySelectorAll(".panel-content").forEach(el => el.classList.add("hidden"));
  // Show target
  const panel = document.getElementById("panel-" + name);
  if (panel) panel.classList.remove("hidden");
  // Update nav active state
  document.querySelectorAll("[data-panel]").forEach(el => {
    el.classList.remove("font-medium", "text-brand-700", "bg-brand-50");
    el.classList.add("text-gray-700");
  });
  const navItem = document.querySelector(`[data-panel="${name}"]`);
  if (navItem) {
    navItem.classList.add("font-medium", "text-brand-700", "bg-brand-50");
    navItem.classList.remove("text-gray-700");
  }
  // Update page title
  const titles = {
    profile: "门店信息", history: "翻译记录", stats: "使用统计", subscription: "订阅状态"
  };
  document.getElementById("pageTitle").textContent = titles[name] || "";
  // Close mobile sidebar
  if (window.innerWidth < 1024) toggleSidebar();
  // Load data
  if (name === "history") loadHistory();
  if (name === "stats") loadStats();
  if (name === "subscription") loadSubscription();
}

// ===== Profile =====
async function loadProfile() {
  try {
    const res = await fetch("/api/merchant/profile");
    if (res.status === 401) { if (!_authRedirecting) { _authRedirecting = true; window.location.href = "/login"; } return; }
    const data = await res.json();
    if (data && data.store_name) {
      document.getElementById("pf_store_name").value = data.store_name || "";
      document.getElementById("pf_category").value = data.category || "";
      document.getElementById("pf_phone").value = data.phone || "";
      document.getElementById("pf_city").value = data.city || "";
      document.getElementById("pf_address").value = data.address || "";
      document.getElementById("pf_description").value = data.description || "";
    }
  } catch(e) {}
}

async function saveProfile(e) {
  e.preventDefault();
  const data = {
    store_name: document.getElementById("pf_store_name").value.trim(),
    category: document.getElementById("pf_category").value,
    phone: document.getElementById("pf_phone").value.trim(),
    city: document.getElementById("pf_city").value.trim(),
    address: document.getElementById("pf_address").value.trim(),
    description: document.getElementById("pf_description").value.trim(),
  };
  if (!data.store_name) { msg("error", "请填写门店名称"); return; }
  try {
    const res = await fetch("/api/merchant/profile", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });
    if (res.status === 401) { if (!_authRedirecting) { _authRedirecting = true; window.location.href = "/login"; } return; }
    if (res.ok) {
      msg("success", "门店信息已保存");
    } else {
      const d = await res.json();
      msg("error", d.error || "保存失败");
    }
  } catch(e) {
    msg("error", "网络错误");
  }
}

// ===== History =====
async function loadHistory() {
  try {
    const res = await fetch("/api/merchant/history");
    if (res.status === 401) { if (!_authRedirecting) { _authRedirecting = true; window.location.href = "/login"; } return; }
    const data = await res.json();
    const list = document.getElementById("historyList");
    const empty = document.getElementById("historyEmpty");
    if (!data || data.length === 0) {
      list.innerHTML = "";
      empty.classList.remove("hidden");
      return;
    }
    empty.classList.add("hidden");
    const TYPE_LABELS = {menu:"菜单/菜品",checkin_guide:"入住指南",room_card:"房型介绍",reg_card:"登记提示卡",emergency_card:"紧急联系卡"};
    const LANG_FLAGS = {en:"🇬🇧",ja:"🇯🇵",ko:"🇰🇷",ru:"🇷🇺"};
    list.innerHTML = data.slice().reverse().map(r => `
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-brand-700">${TYPE_LABELS[r.material_type] || r.material_type} → ${LANG_FLAGS[r.target_lang] || ""} ${r.target_lang.toUpperCase()}</span>
          <span class="text-xs text-gray-400">${new Date(r.timestamp).toLocaleString("zh-CN")}</span>
        </div>
        <div class="text-xs text-gray-500">
          <p class="text-gray-400 mb-1">原文：${escapeHtml(r.source_preview)}${r.source_preview && r.source_preview.length >= 80 ? "…" : ""}</p>
          <p>译文：${escapeHtml(r.translated_preview)}${r.translated_preview && r.translated_preview.length >= 80 ? "…" : ""}</p>
        </div>
      </div>
    `).join("");
  } catch(e) {}
}

// ===== Stats =====
async function loadStats() {
  try {
    const res = await fetch("/api/merchant/stats");
    if (res.status === 401) { if (!_authRedirecting) { _authRedirecting = true; window.location.href = "/login"; } return; }
    const data = await res.json();
    document.getElementById("statToday").textContent = data.today;
    document.getElementById("statTotal").textContent = data.total_all_time;
    document.getElementById("statLimit").textContent = data.limit;
    document.getElementById("barUsed").textContent = data.today;
    document.getElementById("barLimit").textContent = data.limit;
    const pct = data.limit > 0 ? Math.min(100, (data.today / data.limit) * 100) : 0;
    document.getElementById("usageBar").style.width = pct + "%";
    if (pct > 80) document.getElementById("usageBar").classList.replace("bg-brand-600", "bg-red-500");
    else document.getElementById("usageBar").classList.replace("bg-red-500", "bg-brand-600");
  } catch(e) {}
}

// ===== Subscription =====
async function loadSubscription() {
  try {
    const res = await fetch("/api/merchant/subscription");
    if (res.status === 401) { if (!_authRedirecting) { _authRedirecting = true; window.location.href = "/login"; } return; }
    const data = await res.json();
    document.getElementById("subContent").innerHTML = `
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="text-lg font-bold text-gray-900">${data.name}</h3>
            <p class="text-sm text-gray-500">${data.expires_at ? "有效期至 " + new Date(data.expires_at).toLocaleDateString("zh-CN") : "长期有效"}</p>
          </div>
          <span class="px-3 py-1 bg-brand-50 text-brand-700 rounded-full text-xs font-medium">当前套餐</span>
        </div>
        <div class="border-t border-gray-100 pt-4">
          <p class="text-sm font-medium text-gray-700 mb-2">包含功能：</p>
          <ul class="space-y-2">
            ${(data.features || []).map(f => `
              <li class="flex items-center gap-2 text-sm text-gray-600">
                <svg class="w-4 h-4 text-green-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                ${f}
              </li>
            `).join("")}
          </ul>
        </div>
        <div class="border-t border-gray-100 pt-4 mt-4">
          <a href="/subscription" class="inline-flex items-center gap-2 px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition-colors">
            升级套餐
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
          </a>
        </div>
      </div>
    `;
  } catch(e) {}
}

// ===== Auth =====
async function checkAuth() {
  try {
    const res = await fetch("/api/auth/me");
    const data = await res.json();
    if (!data.authenticated) {
      if (!_authRedirecting) { _authRedirecting = true; window.location.href = "/login"; }
      return;
    }
    const phone = data.phone || "---";
    document.getElementById("sidebarPhone").textContent = phone;
    document.getElementById("headerPhone").textContent = phone;
    document.getElementById("mobileUser").textContent = phone;
    document.getElementById("userAvatar").textContent = phone.slice(-2);
    const usage = data.usage ? data.usage.today + "/" + data.usage.limit : "—";
    document.getElementById("sidebarUsage").textContent = "今日 " + usage;
  } catch(e) {}
}

// Init
checkAuth();
loadProfile();
</script>
